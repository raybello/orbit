# The stack the desktop app bundles and runs: published images only, no build step, no network
# beyond the registry pull. The app writes .env in this folder before `up` (SESSION_SECRET,
# DB_ENCRYPTION_KEY and STACK_TOKEN are generated there) and then reads the stack's state from
# GET /api/health.
#
#   docker compose -f docker-compose.images.yml --env-file .env up -d
#
# Run it from a directory holding both files (the desktop app copies them into userData/stack and
# puts its generated .env beside them). ORBIT_IMAGE_TAG selects the release: edge tracks main.
name: orbit

services:
  api:
    image: ghcr.io/raybello/orbit/app:${ORBIT_IMAGE_TAG:-edge}
    # The mounted Docker socket is root:docker inside Docker Desktop's VM and its group id
    # changes between installs, so a non-root user cannot open it (EACCES, which the screen
    # relay reports as "couldn't reach the screen"). Socket access is already equivalent to
    # host root, so the group workaround buys nothing; run as root and say so. Without the
    # socket, the image still defaults to its non-root user.
    user: "0:0"
    init: true
    restart: unless-stopped
    env_file:
      # Written by the desktop app's stack controller (or copied from .env.images.example) beside
      # this file before `up`. Not required here so `docker compose config` works on a fresh clone.
      - path: .env
        required: false
    environment:
      PORT: "8787"
      # The bundled gateway refuses to run as root unless this is set. It is set because this
      # container is root for the Docker socket (see `user:` above) and its only Hermes home is
      # the root-owned data volume — nothing else ever writes there.
      HERMES_ALLOW_ROOT_GATEWAY: "1"
      # The container's paths, not the host's: the app must not be able to override these.
      DB_PATH: /data/orbit.db
      ENGINES_DIR: /data/engines
      COMPUTER_HOME_DIR: ${COMPUTER_HOME_DIR:-/data/computers}
      DOCKER_SOCKET: /var/run/docker.sock
      APP_URL: ${APP_URL:-http://127.0.0.1:8787}
      SERVER_URL: ${SERVER_URL:-http://127.0.0.1:8787}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://host.docker.internal:8787}
      HERMES_URL: ${HERMES_URL:-http://host.docker.internal:8642}
      # The CLI the image ships, used to start one `hermes gateway run` per managed Bot. A stack .env
      # that still carries a host path (HERMES_BIN=/Users/you/.local/bin/hermes) is harmless: the
      # server falls back to this one, then to the known install locations, before it reports a miss.
      HERMES_BIN: ${HERMES_BIN:-/opt/hermes/.venv/bin/hermes}
      # An empty COMPUTER_IMAGE from a copied .env used to reach the Docker client as "",
      # which it turned into a request for a host named "images" and crashed the boot path.
      COMPUTER_IMAGE: ${COMPUTER_IMAGE:-orbit/computer:local}
      # The primary agent inside the container: its config/auth live on the data volume. The real
      # primary agent runs on the host and is reached over HERMES_URL; this is only the home a
      # managed bot seeds its own config from.
      HERMES_HOME_PRIMARY: ${HERMES_HOME_PRIMARY:-/data/hermes}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Loopback only. ORBIT_API_PORT=0 in .env.images.example is the "let the OS pick" case the
      # desktop controller uses when 8787 is taken; this port is the one the app loads.
      - "127.0.0.1:${ORBIT_WEB_PORT:-8787}:8787"
    volumes:
      - orbit-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Per-bot computers need one host folder mounted at the same path here and on the host:
      # - ${ORBIT_HOST_DATA}:${ORBIT_HOST_DATA}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  sandbox-supervisor:
    # Same image as api; this entrypoint binds nothing and only pauses idle bot containers. It has
    # to see the same database and the same Docker daemon, hence the same volume and socket.
    image: ghcr.io/raybello/orbit/app:${ORBIT_IMAGE_TAG:-edge}
    # The mounted Docker socket is root:docker inside Docker Desktop's VM and its group id
    # changes between installs, so a non-root user cannot open it (EACCES, which the screen
    # relay reports as "couldn't reach the screen"). Socket access is already equivalent to
    # host root, so the group workaround buys nothing; run as root and say so. Without the
    # socket, the image still defaults to its non-root user.
    user: "0:0"
    command: ["node", "dist/supervisor.js"]
    # The image's healthcheck probes :8787, and this entrypoint deliberately binds no port — without
    # this it reports "unhealthy" forever while doing exactly its job.
    healthcheck:
      test: ["NONE"]
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/orbit.db
      ENGINES_DIR: /data/engines
      COMPUTER_HOME_DIR: ${COMPUTER_HOME_DIR:-/data/computers}
      DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?SANDBOX_SUPERVISOR_TOKEN is required; the desktop app generates it (openssl rand -hex 32)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - orbit-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # - ${ORBIT_HOST_DATA}:${ORBIT_HOST_DATA}

volumes:
  orbit-data:
