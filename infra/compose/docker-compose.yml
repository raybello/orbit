# Source-based stack: builds the API out of this checkout. For development, and for anyone who
# wants to run Orbit's server without installing Node on the host.
#
#   cp infra/compose/.env.example ../../.env      # once, at the repo root; fill in SESSION_SECRET
#   docker compose -f infra/compose/docker-compose.yml up --build
#   open http://127.0.0.1:8787
#
# Interpolation variables (`${VAR:-default}`) are read from the shell and from the env file passed
# with --env-file (infra/compose/.env.example works as-is). Container env comes from the repo .env.
name: orbit

services:
  api:
    build:
      # The context is the workspace root: the image needs pnpm-lock.yaml, packages/* and both apps.
      context: ../..
      dockerfile: apps/server/Dockerfile
    image: orbit/app:dev
    # The mounted Docker socket is root:docker inside Docker Desktop's VM and its group id
    # changes between installs, so a non-root user cannot open it (EACCES, which the screen
    # relay reports as "couldn't reach the screen"). Socket access is already equivalent to
    # host root, so the group workaround buys nothing; run as root and say so. Without the
    # socket, the image still defaults to its non-root user.
    user: "0:0"
    init: true
    restart: unless-stopped
    env_file:
      # The same .env the `pnpm dev` path uses. Missing on a fresh clone; the defaults below keep
      # the container startable (SESSION_SECRET still has to come from .env — see .env.example).
      - path: ../../.env
        required: false
    environment:
      PORT: "8787"
      # The bundled gateway refuses to run as root unless this is set. It is set because this
      # container is root for the Docker socket (see `user:` above) and its only Hermes home is
      # the root-owned data volume — nothing else ever writes there.
      HERMES_ALLOW_ROOT_GATEWAY: "1"
      # Everything the server writes lives on the volume, so `up --build` and image upgrades keep it.
      DB_PATH: /data/orbit.db
      ENGINES_DIR: /data/engines
      # The Library (saved files, screenshots, images a Bot finds) is on the volume too. The
      # default is inside the container's writable layer, which a --force-recreate throws away:
      # every Library file and message attachment would 404 with nothing saying why.
      BOT_DATA_DIR: /data/files
      # The on-device voice models (263 MB) live on the data volume, not in the container's
      # writable layer: a `--force-recreate` would otherwise throw them away and the next
      # /api/voice/local/status would silently re-download them.
      VOICE_MODELS_DIR: /data/voice-models
      COMPUTER_HOME_DIR: ${COMPUTER_HOME_DIR:-/data/computers}
      DOCKER_SOCKET: /var/run/docker.sock
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The browser reaches the API on the published port. Every Hermes agent runs in here.
      APP_URL: ${APP_URL:-http://127.0.0.1:8787}
      SERVER_URL: ${SERVER_URL:-http://127.0.0.1:8787}
      # Managed Bots run inside this stack, so they need the CLI the image installs — not the host's.
      # A repo .env that still says HERMES_BIN=hermes (or a macOS path) is fine: the server resolves
      # it, falls back to the known install locations, and this is the one that exists here.
      HERMES_BIN: ${HERMES_BIN:-/opt/hermes/.venv/bin/hermes}
      # An empty COMPUTER_IMAGE from a copied .env used to reach the Docker client as "",
      # which it turned into a request for a host named "images" and crashed the boot path.
      COMPUTER_IMAGE: ${COMPUTER_IMAGE:-orbit/computer:local}
      # GPU voice (audio.cpp). The `audiocpp` service below answers here when the stack runs with
      # `--profile gpu`; point it at http://host.docker.internal:8080 for an audiocpp_server running
      # natively on the host instead. Unreachable = GPU voice is simply unavailable.
      AUDIOCPP_URL: ${AUDIOCPP_URL:-http://audiocpp:8080}
      AUDIOCPP_MODELS_DIR: /data/audiocpp-models
    ports:
      - "127.0.0.1:${ORBIT_WEB_PORT:-8787}:8787"
    volumes:
      - orbit-data:/data
      # One bot = one container: the API has to reach the daemon to start them.
      - /var/run/docker.sock:/var/run/docker.sock
      # Per-bot computers are host folders bind-mounted into bot containers, so the path has to be
      # the same on the host and in this container. Set ORBIT_HOST_DATA (e.g. $HOME/.orbit/data)
      # and COMPUTER_HOME_DIR=$ORBIT_HOST_DATA/computers, then uncomment:
      # - ${ORBIT_HOST_DATA}:${ORBIT_HOST_DATA}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  sandbox-supervisor:
    # The same image, a different entrypoint: it serves nothing, it only suspends idle bot
    # containers — including when the API is down. No ports.
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    image: orbit/app:dev
    # The mounted Docker socket is root:docker inside Docker Desktop's VM and its group id
    # changes between installs, so a non-root user cannot open it (EACCES, which the screen
    # relay reports as "couldn't reach the screen"). Socket access is already equivalent to
    # host root, so the group workaround buys nothing; run as root and say so. Without the
    # socket, the image still defaults to its non-root user.
    user: "0:0"
    command: ["node", "dist/supervisor.js"]
    # The image's healthcheck probes :8787, and this entrypoint deliberately binds no port — without
    # this it reports "unhealthy" forever while doing exactly its job.
    healthcheck:
      test: ["NONE"]
    init: true
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      # Has to match the api service: same database, same Docker daemon, same host folders.
      DB_PATH: /data/orbit.db
      ENGINES_DIR: /data/engines
      COMPUTER_HOME_DIR: ${COMPUTER_HOME_DIR:-/data/computers}
      DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?SANDBOX_SUPERVISOR_TOKEN is required; the desktop app generates it (openssl rand -hex 32)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - orbit-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # - ${ORBIT_HOST_DATA}:${ORBIT_HOST_DATA}

  audiocpp:
    # GPU voice: OWSM ASR, LFM3-Audio TTS and SoulX-FlashHead avatar video (infra/audiocpp/Dockerfile).
    # Opt-in, because it needs an NVIDIA GPU and the NVIDIA Container Toolkit:
    #   docker compose -f infra/compose/docker-compose.yml --profile gpu up --build
    # Verify the runtime first: docker run --rm --gpus all nvidia/cuda:12.8.1-base-ubuntu22.04 nvidia-smi
    profiles: [gpu]
    build:
      context: ../..
      dockerfile: infra/audiocpp/Dockerfile
      args:
        # GPU architectures audio.cpp is compiled for. scripts/gpu-voice-stack.sh sets just this
        # machine's (nvidia-smi compute_cap), which cuts the build to a fraction.
        CUDA_ARCHITECTURES: ${AUDIOCPP_CUDA_ARCHS:-75;80;86;89;90;120}
        AUDIOCPP_REF: ${AUDIOCPP_REF:-v0.9.5}
    image: orbit/audiocpp:dev
    restart: unless-stopped
    labels:
      # The api finds this container by label (POST /api/voice/audiocpp/models/download runs
      # download-models.py in it), so the compose project/container name does not matter.
      orbit.role: audiocpp
    environment:
      AUDIOCPP_MODELS_DIR: /data/audiocpp-models
      HF_TOKEN: ${HF_TOKEN:-}
      # 1 = fetch the ~5 GB of models at boot instead of waiting for Orbit to ask.
      AUDIOCPP_AUTO_DOWNLOAD: ${AUDIOCPP_AUTO_DOWNLOAD:-0}
      # Hostnames/IPs the built-in Caddy issues internal-CA certificates for. Add the LAN address you
      # open Orbit from (e.g. "localhost 10.0.0.92") so the microphone works from other devices.
      AUDIOCPP_TLS_HOSTS: ${AUDIOCPP_TLS_HOSTS:-localhost 127.0.0.1}
      # :8444 fronts the Orbit web app over HTTPS (WebSockets included); empty disables that site.
      ORBIT_HTTPS_UPSTREAM: ${ORBIT_HTTPS_UPSTREAM:-http://api:8787}
      # SoulX VAE: cudnn (built in; ~2x faster, less VRAM) or ggml.
      AUDIOCPP_AVATAR_VAE: ${AUDIOCPP_AVATAR_VAE:-cudnn}
    # :8080 (audiocpp_server) stays on the compose network: only the api talks to it. The HTTPS front
    # door is published; set AUDIOCPP_HTTPS_BIND=0.0.0.0 to reach it from other devices on the LAN.
    ports:
      - "${AUDIOCPP_HTTPS_BIND:-127.0.0.1}:${AUDIOCPP_HTTPS_PORT:-8443}:8443"
      - "${AUDIOCPP_HTTPS_BIND:-127.0.0.1}:${ORBIT_HTTPS_PORT:-8444}:8444"
    volumes:
      - orbit-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Covers loading three models onto the GPU, not the download: until the models are on the
      # volume the server is not started and the container reports unhealthy, by design.
      start_period: 120s

volumes:
  orbit-data:
