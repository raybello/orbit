# Builds and publishes the Orbit desktop app on a `v*` tag.
#
# One job per OS because electron-builder cross-builds poorly: macOS needs the signing
# identity, Windows needs NSIS, Linux needs AppImage tooling. All three upload to the same
# GitHub Release (electron-builder creates it on first publish; the rest append).
#
# Signing material (all optional — without it the builds are unsigned and the macOS one is
# not notarized):
#   GH_TOKEN                             a token with `contents: write` (falls back to the
#                                        workflow's own GITHUB_TOKEN)
#   APPLE_DEVELOPER_CERTIFICATE          base64 .p12 for the Developer ID identity
#   APPLE_DEVELOPER_CERTIFICATE_PASSWORD  its password
#   APPLE_TEAM_ID                        the 10-char team id
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD  notarization credentials (optional)
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER  the API-key alternative

name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases (otherwise just build artifacts)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: mac
          - name: Windows
            os: windows-latest
            platform: win
          - name: Linux
            os: ubuntu-latest
            platform: linux

    env:
      # electron-builder reads these; empty on the non-matching platforms.
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.APPLE_DEVELOPER_CERTIFICATE || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
      APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      # Keep electron-builder from trying to sign with a keychain identity that isn't there.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && secrets.APPLE_DEVELOPER_CERTIFICATE != '' || false }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        shell: bash
        run: |
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$PKG" != "$TAG" ]; then
              echo "::error::tag v$TAG does not match apps/desktop/package.json version $PKG"
              exit 1
            fi
          fi
          echo "version $PKG"

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Test the desktop code
        run: pnpm --filter @orbit/desktop run test

      - name: Build the web renderer
        run: pnpm --filter @orbit/web run build

      - name: Build the desktop bundle
        run: pnpm --filter @orbit/desktop run build

      - name: Check packaging inputs
        run: pnpm --filter @orbit/desktop run check-resources

      # --- macOS: signed + notarized when the secrets exist, plain build otherwise.
      - name: Package (macOS, notarized)
        if: matrix.platform == 'mac' && env.APPLE_TEAM_ID != '' && env.APPLE_ID != ''
        run: pnpm --filter @orbit/desktop exec electron-builder --mac --publish always --config.mac.notarize=true

      - name: Package (macOS, unsigned)
        if: matrix.platform == 'mac' && (env.APPLE_TEAM_ID == '' || env.APPLE_ID == '')
        run: |
          echo "::warning::Apple credentials are not configured; building without notarization"
          pnpm --filter @orbit/desktop exec electron-builder --mac --publish always

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: pnpm --filter @orbit/desktop exec electron-builder --win --publish always

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: pnpm --filter @orbit/desktop exec electron-builder --linux --publish always

      - name: Smoke the packaged app (macOS)
        if: matrix.platform == 'mac'
        run: |
          APP=$(ls -d apps/desktop/out/mac*/Orbit.app | head -1)
          ORBIT_SMOKE=1 "$APP/Contents/MacOS/Orbit" || echo "::warning::packaged smoke test did not report ok"

      - name: Keep the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.exe
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.blockmap
            apps/desktop/out/latest*.yml
          if-no-files-found: warn
          retention-days: 14
