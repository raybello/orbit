name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's `packageManager`; passing it here too
      # makes action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check generated docs are up to date
        run: python3 scripts/build-docs.py && git diff --exit-code docs/

      - name: No import cycles through the agent loop
        run: node scripts/check-import-cycles.mjs

      - name: Typecheck every package
        run: pnpm run typecheck

      - name: Build packages and apps
        run: pnpm run build

      - name: Unit tests (web + desktop)
        run: pnpm run test

      - name: Server API smoke test
        run: node scripts/smoke-server.mjs
