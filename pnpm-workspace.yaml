packages:
  - "apps/*"
  - "packages/*"

# pnpm 12: native build scripts must be allowed explicitly, per package.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  fsevents: true
  electron: true
  electron-winstaller: true
  cpu-features: true
  protobufjs: true
  ssh2: true
  # sharp ships prebuilt libvips binaries (@img/sharp-*); its install script only builds from source.
  sharp: false
